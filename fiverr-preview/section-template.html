<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SchoolMS Section Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 769px;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at 90% 10%, rgba(56,189,248,.16), transparent 40%),
        linear-gradient(135deg, #07111f, #0b1a33 55%, #081224);
      color: #fff;
      padding: 34px 42px;
    }
    .tag {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,.25);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      color: #94a3b8;
      text-transform: uppercase;
    }
    h1 {
      margin-top: 12px;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .sub {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 14px;
    }
    .stage {
      margin-top: 26px;
      display: flex;
      align-items: flex-end;
      gap: 28px;
      height: 560px;
    }
    .monitor {
      flex: 1;
      height: 100%;
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.22);
      background: #0f172a;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(2,6,23,.45);
    }
    .monitor img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .phone {
      width: 220px;
      height: 470px;
      border-radius: 28px;
      border: 3px solid #334155;
      background: #020617;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(2,6,23,.5);
      flex-shrink: 0;
    }
    .phone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
  </style>
</head>
<body>
  <h1 id="title">Landing Hero — Desktop + Mobile</h1>
  <p class="sub" id="subtitle">Homepage module</p>
  <div class="stage">
    <div class="monitor"><img id="desktop" src="assets/landing-hero.png" alt="Desktop" /></div>
    <div class="phone"><img id="mobile" src="assets/landing-hero-mobile.png" alt="Mobile" /></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("title").textContent = params.get("title") || "Landing Hero — Desktop + Mobile";
    document.getElementById("subtitle").textContent = params.get("subtitle") || "Homepage module";
    document.getElementById("desktop").src = params.get("img") || "assets/landing-hero.png";
    document.getElementById("mobile").src = params.get("mobile") || params.get("img") || "assets/landing-hero-mobile.png";
  </script>
</body>
</html>
